# Octopus Local Stack Configuration
#
# This file contains non-secret settings only. Credentials are generated when
# the stack is first started, held in Docker-managed runtime state, and exposed
# to authorised local consumers through `make connection-json`.

env:
  # Fixed account and resource identifiers used by the disposable stack.
  ADMIN_USERNAME: "admin"
  OCTOPUS_SPACE: "Spaces-1"
  OCTOPUS_DB_NAME: "OctopusDeploy"

  # Host and container access endpoints.
  OCTOPUS_URL: "http://localhost:8080"
  OCTOPUS_INTERNAL_URL: "http://host.docker.internal:8080"
