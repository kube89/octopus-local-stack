name: octopus-local-stack
services:
  cli:
    container_name: octopus-local-stack-cli
    image: octopus-local-stack-cli
    build: .
    environment:
      - DOCKER_DEFAULT_PLATFORM=${DOCKER_DEFAULT_PLATFORM:-linux/amd64}
      - OCTOPUS_SERVER_BASE64_LICENSE=${OCTOPUS_SERVER_BASE64_LICENSE:-}
    volumes:
      # Mount docker socket to control host docker
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount project root as workspace
      - ../../:/workspace
      # Persist generated credentials outside the repository.
      - octopus-local-stack-runtime:/runtime
    working_dir: /workspace
    # Keep container running for exec, or run one-shot commands
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  octopus-local-stack-runtime:
    name: octopus-local-stack-runtime
